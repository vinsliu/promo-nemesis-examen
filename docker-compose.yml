# Usage : docker compose --env-file .env.docker up --build -d
name: exam1-local

x-node: &node
  restart: unless-stopped
  init: true
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  frontend:
    <<: *node
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    depends_on:
      backend:
        condition: service_healthy

  backend:
    <<: *node
    build:
      context: .
      dockerfile: Dockerfile.node
      args:
        SERVICE: backend
    environment:
      PORT: 5000
      MONGO_URI: mongodb://mongo:27017/exam1Db
      JWT_SECRET: ${JWT_SECRET:?Definir JWT_SECRET dans .env.docker}
      NOTIFICATION_URL: http://gateway:8000/notify
      NOTIFICATION_EMAIL: ${NOTIFICATION_EMAIL:-}
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:?Definir INTERNAL_API_TOKEN dans .env.docker}
    depends_on:
      mongo:
        condition: service_healthy
      gateway:
        condition: service_started
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5000/api/products').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  mongo:
    <<: *node
    image: mongo:8.0
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "quit(db.adminCommand('ping').ok ? 0 : 1)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  gateway:
    <<: *node
    build:
      context: .
      dockerfile: Dockerfile.node
      args:
        SERVICE: gateway
    environment:
      GATEWAY_PORT: 8000
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:?Definir INTERNAL_API_TOKEN dans .env.docker}
      NOTIFI_SERVICE_URL: http://notifications:4002
      STOCK_SERVICE_URL: http://stock-management:4003
    depends_on:
      - notifications
      - stock-management

  notifications:
    <<: *node
    build:
      context: .
      dockerfile: Dockerfile.node
      args:
        SERVICE: microservices/notifications
    command: ["node", "index.js"]
    environment:
      NOTIFI_PORT: 4002
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:?Definir INTERNAL_API_TOKEN dans .env.docker}
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-smtp}
      EMAIL_FROM: ${EMAIL_FROM:-}
      EMAIL_REPLY_TO: ${EMAIL_REPLY_TO:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      NOTIFICATION_TEST_EMAIL: ${NOTIFICATION_TEST_EMAIL:-}
      EMAIL_USER: ${EMAIL_USER:-}
      EMAIL_APPLICATION_PASSWORD: ${EMAIL_APPLICATION_PASSWORD:-}

  stock-management:
    <<: *node
    build:
      context: .
      dockerfile: Dockerfile.node
      args:
        SERVICE: microservices/stock-management
    command: ["node", "index.js"]

volumes:
  mongo-data:
